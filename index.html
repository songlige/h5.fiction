<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .menu-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            margin-top: 30vh; /* 确保游戏列表不被banner遮挡 */
        }
        .banner-container {
            width: 100%;
            height: 30vh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            z-index: 1000; /* 确保banner在游戏列表之上 */
            touch-action: none; /* 禁用默认触摸行为，支持自定义滑动 */
        }
        /* 定义页面顶部固定横幅的样式 */
        .indicators {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }
        .indicator {
            width: 12px;
            height: 12px;
            background-color: #ccc;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .indicator.active {
            background-color: #333;
        }
        .banner-item {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
            background-color: #f0f0f0; /* 默认背景色，如果图片加载失败 */
        }
        .banner-item.active {
            opacity: 1;
        }
        .game-item {
            width: 100%;
            height: 20vh;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            cursor: pointer;
        }
        .game-info {
            flex: 1;
        }
        .game-title {
            font-size: 24px;
            margin: 0;
        }
        .game-desc {
            font-size: 16px;
            color: #666;
            margin: 5px 0 0 0;
        }
        .game-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
    <title>游戏菜单</title>
</head>
<body>
    <div class="banner-container">
        <div class="banner-item" id="banner1" style="background-image: url(image.png)"></div>
        <div class="banner-item" id="banner2" style="background-image: url(image2.png)"></div>
        <div class="banner-item" id="banner3" style="background-image: url(image3.png)"></div>
        <div class="banner-item" id="banner4" style="background-image: url(image.png)"></div>
        <div class="banner-item" id="banner5" style="background-image: url(image2.png)"></div>
        <div class="indicators"></div>
    </div>
    <div class="menu-container">
        <div class="game-item" onclick="showBanner(0)">
            <div class="game-info">
                <h3 class="game-title">游戏1</h3>
                <p class="game-desc">这是一个精彩的冒险游戏。</p>
            </div>
            <img class="game-image" src="image.png" alt="游戏1">
        </div>
        <div class="game-item" onclick="showBanner(1)">
            <div class="game-info">
                <h3 class="game-title">游戏2</h3>
                <p class="game-desc">挑战你的策略思维。</p>
            </div>
            <img class="game-image" src="image2.png" alt="游戏2">
        </div>
        <div class="game-item" onclick="showBanner(2)">
            <div class="game-info">
                <h3 class="game-title">游戏3</h3>
                <p class="game-desc">多人在线竞技场。</p>
            </div>
            <img class="game-image" src="image3.png" alt="游戏3">
        </div>
        <div class="game-item" onclick="showBanner(3)">
            <div class="game-info">
                <h3 class="game-title">游戏4</h3>
                <p class="game-desc">轻松休闲的益智游戏。</p>
            </div>
            <img class="game-image" src="image.png" alt="游戏4">
        </div>
        <div class="game-item" onclick="showBanner(4)">
            <div class="game-info">
                <h3 class="game-title">游戏5</h3>
                <p class="game-desc">探索未知的世界。</p>
            </div>
            <img class="game-image" src="image2.png" alt="游戏5">
        </div>
        <!-- 根据需要添加更多游戏项 -->
    </div>

    <script>
        let currentBannerIndex = 0;
        const bannerItems = document.querySelectorAll('.banner-item');
        const totalBanners = bannerItems.length;
        const bannerContainer = document.querySelector('.banner-container');
        let startX = 0;
        let endX = 0;

        function showBanner(index) {
            // 隐藏所有banner项
            bannerItems.forEach(item => item.classList.remove('active'));
            
            // 显示选中的banner项
            bannerItems[index].classList.add('active');
            
            // 更新指示器
            document.querySelectorAll('.indicator').forEach((ind, i) => {
                ind.classList.toggle('active', i === index);
            });
            
            // 更新当前banner索引
            currentBannerIndex = index;
        }

        function nextBanner() {
            currentBannerIndex = (currentBannerIndex + 1) % totalBanners;
            showBanner(currentBannerIndex);
        }

        function prevBanner() {
            currentBannerIndex = (currentBannerIndex - 1 + totalBanners) % totalBanners;
            showBanner(currentBannerIndex);
        }

        // 触摸事件支持滑动切换
        bannerContainer.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
        });

        bannerContainer.addEventListener('touchend', (e) => {
            endX = e.changedTouches[0].clientX;
            const diffX = startX - endX;
            if (Math.abs(diffX) > 50) { // 滑动阈值50px
                if (diffX > 0) {
                    // 左滑，下一个banner
                    nextBanner();
                } else {
                    // 右滑，上一个banner
                    prevBanner();
                }
            }
        });

        // 初始化显示第一个banner
        window.onload = function() {
            // 创建指示器
            const indicatorsContainer = document.querySelector('.indicators');
            for (let i = 0; i < totalBanners; i++) {
                const indicator = document.createElement('span');
                indicator.className = 'indicator';
                indicator.addEventListener('click', () => showBanner(i));
                indicatorsContainer.appendChild(indicator);
            }
            
            showBanner(currentBannerIndex);
            setInterval(nextBanner, 5000); // 每5秒切换到下一个banner
        };
    </script>
</body>
</html>
